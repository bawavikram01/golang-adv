# Server port (auto-configured by spring-boot-starter-web)
server.port=8080

# Expose all actuator endpoints for learning
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Custom app info
spring.application.name=spring-boot-internals
info.app.name=Spring Boot Internals Demo
info.app.version=1.0.0
info.app.description=Demonstrates auto-configuration and embedded server
