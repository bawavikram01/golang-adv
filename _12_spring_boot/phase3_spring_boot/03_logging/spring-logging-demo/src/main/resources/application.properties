server.port=8082
spring.application.name=logging-demo

# ─── Log Level Configuration ─────────────────────────────────
# Root level: show INFO and above for everything
logging.level.root=INFO

# OUR package: show DEBUG and above (more verbose)
logging.level.com.learn.logging=DEBUG

# Spring framework: only WARN and above (less noisy)
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO

# Hibernate SQL: show actual SQL queries (if we had JPA)
# logging.level.org.hibernate.SQL=DEBUG

# ─── File Logging ─────────────────────────────────────────────
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
